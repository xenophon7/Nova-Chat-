<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1677ff"><title>NovaChat V7</title><style>
:root{--p:#1677ff;--bg:#f1f5f9;--card:#fff;--txt:#17212b;--muted:#718096;--line:#dde5ed;--mine:#dceaff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:var(--bg);color:var(--txt)}body.dark{--bg:#0b1118;--card:#121a23;--txt:#edf2f7;--muted:#9aa8b8;--line:#283644;--mine:#12345a}.hidden{display:none!important}button,input{font:inherit}button{cursor:pointer;border:0}.top{height:62px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:8px 12px;position:sticky;top:0;z-index:3}.brand{font-weight:800;font-size:20px;flex:1}.icon{width:42px;height:42px;border-radius:14px;background:transparent;color:var(--txt)}.avatar{width:40px;height:40px;border-radius:50%;background:var(--p);color:white;display:grid;place-items:center;font-weight:800;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}main{padding:14px}.panel{max-width:720px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}.search{display:flex;gap:7px;padding:12px;border-bottom:1px solid var(--line)}input{border:1px solid var(--line);background:var(--bg);color:var(--txt);border-radius:14px;padding:12px;outline:0}.search input{flex:1}.primary,.send{background:var(--p);color:#fff;padding:11px 15px;border-radius:13px}.contact{display:flex;gap:12px;align-items:center;padding:13px;border-bottom:1px solid var(--line);cursor:pointer}.contact:hover{background:var(--bg)}.info{flex:1}.info small,.empty,.status{color:var(--muted)}.empty{text-align:center;padding:35px}.fab{position:fixed;right:18px;bottom:18px;width:60px;height:60px;border-radius:20px;background:var(--p);color:#fff;font-size:26px;box-shadow:0 10px 30px #0004}.modal,.chat{position:fixed;inset:0;z-index:20}.modal{background:#0008;display:flex;align-items:flex-end}.sheet{background:var(--card);width:min(720px,100%);margin:auto 0 0;border-radius:24px 24px 0 0;padding:18px;max-height:90vh;overflow:auto}.form{display:grid;gap:10px}.form input{width:100%}.form button{padding:13px;border-radius:13px;background:var(--p);color:#fff}.secondary{background:var(--bg)!important;color:var(--txt)!important}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.chat{background:var(--bg);display:flex;flex-direction:column}.chathead{height:62px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:8px}.title{flex:1}.chatbody{flex:1;overflow:auto;padding:14px 10px 78px;background-size:cover;background-position:center}.bubble{max-width:82%;background:var(--card);border:1px solid var(--line);padding:9px 11px;border-radius:17px;margin:6px 0;word-break:break-word}.mine{margin-left:auto;background:var(--mine);border-bottom-right-radius:5px}.theirs{border-bottom-left-radius:5px}.bubble img{max-width:100%;border-radius:12px}.bubble audio{max-width:100%}.time{font-size:10px;color:var(--muted);text-align:right;margin-top:3px}.composer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:7px;display:flex;gap:6px;z-index:22}.composer input{flex:1;min-width:0}.round{width:42px;height:42px;border-radius:14px;background:var(--bg);color:var(--txt)}.recording{background:#e53935;color:#fff}.switch{width:52px;height:30px;border-radius:20px;background:#9aa4ae;padding:3px}.switch i{display:block;width:24px;height:24px;border-radius:50%;background:#fff}.switch.on{background:var(--p)}.switch.on i{transform:translateX(22px)}#loading{position:fixed;inset:0;background:var(--bg);z-index:99;display:grid;place-items:center}.load{text-align:center}.logo{width:76px;height:76px;border-radius:24px;background:var(--p);color:#fff;display:grid;place-items:center;font-size:38px;font-weight:900;margin:auto}.bar{width:240px;height:6px;background:#d9e2ec;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:35%;background:var(--p);animation:go 1.1s infinite}@keyframes go{from{transform:translateX(-120%)}to{transform:translateX(350%)}}.badge{background:#e53935;color:#fff;border-radius:20px;padding:2px 6px;font-size:10px}
</style></head><body><div id="loading"><div class="load"><div class="logo">N</div><h2>NovaChat</h2><p>Chargement…</p><div class="bar"><i></i></div></div></div><div id="app" class="hidden"><header class="top"><button class="icon" id="settings">⚙️</button><div class="brand">NovaChat</div><button class="icon" id="notifs">🔔 <span id="nb" class="badge hidden">0</span></button><div id="myav" class="avatar">N</div></header><main><section class="panel"><div class="search"><input id="q" placeholder="Rechercher par nom…"><button class="primary" id="find">🔎</button></div><div id="list" class="empty">Recherche un nom pour commencer.</div></section></main><button class="fab" id="fab">💬</button></div>
<div id="auth" class="modal"><div class="sheet"><h2 id="at">Connexion</h2><div class="form"><input id="an" placeholder="Nom"><input id="ap" type="password" placeholder="Mot de passe"><button id="as">Se connecter</button><button class="secondary" id="sw">Créer un compte</button><div id="ae" class="status"></div></div></div></div>
<div id="set" class="modal hidden"><div class="sheet"><h2>Paramètres</h2><div class="row"><b>Mode sombre</b><button id="dark" class="switch"><i></i></button></div><div class="row"><b>Couleur</b><input id="color" type="color" value="#1677ff"></div><div class="row"><b>Arrière-plan chat</b><input id="bg" type="file" accept="image/*"></div><div class="row"><b>Photo profil</b><input id="pf" type="file" accept="image/*"></div><div class="row"><button id="logout" class="primary">Déconnexion</button><button id="close" class="secondary">Fermer</button></div></div></div>
<div id="chat" class="chat hidden"><header class="chathead"><button class="icon" id="back">←</button><div id="cav" class="avatar">N</div><div class="title"><b id="cn"></b><div id="cs" class="status">Conversation</div></div><button class="icon" id="block">⋮</button></header><div id="msgs" class="chatbody"></div><div class="composer"><button class="round" id="photo">🖼️</button><button class="round" id="mic">🎤</button><input id="text" placeholder="Écrire un message…"><button class="round send" id="send">➤</button><input id="img" type="file" accept="image/*" class="hidden"></div></div><div id="toast" class="status" style="position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 13px;border-radius:12px;z-index:80;display:none"></div>
<script>
const $=x=>document.querySelector(x);let me=null,current=null,timer=null,last='',reg=false,rec=null,chunks=[];let S={dark:localStorage.nova_dark==='1',color:localStorage.nova_color||'#1677ff',bg:localStorage.nova_bg||''};
function toast(x){let t=$('#toast');t.textContent=x;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',2200)}function theme(){document.body.classList.toggle('dark',S.dark);document.documentElement.style.setProperty('--p',S.color);$('#dark')?.classList.toggle('on',S.dark);$('#color').value=S.color}function av(e,u){e.innerHTML='';if(u?.profilePhoto){let i=new Image();i.src=u.profilePhoto;e.append(i)}else e.textContent=(u?.name||'?')[0].toUpperCase()}async function api(u,o={}){let r=await fetch(u,{credentials:'same-origin',...o,headers:{'Content-Type':'application/json',...(o.headers||{})}}),d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Erreur');return d}
async function boot(){theme();try{me=(await api('/api/me')).user;$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');av($('#myav'),me);loadN()}catch{}$('#loading').style.display='none'}
$('#as').onclick=async()=>{try{let d=await api(reg?'/api/register':'/api/login',{method:'POST',body:JSON.stringify({name:$('#an').value,password:$('#ap').value})});me=d.user;$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');av($('#myav'),me);loadN()}catch(e){$('#ae').textContent=e.message}};$('#sw').onclick=()=>{reg=!reg;$('#at').textContent=reg?'Créer un compte':'Connexion';$('#as').textContent=reg?'Créer le compte':'Se connecter';$('#sw').textContent=reg?'J’ai déjà un compte':'Créer un compte'};
async function search(){let q=$('#q').value.trim();if(!q)return;try{let d=await api('/api/users?q='+encodeURIComponent(q));let b=$('#list');b.className='';b.innerHTML='';if(!d.users.length){b.className='empty';b.textContent='Aucun utilisateur trouvé.';return}d.users.forEach(u=>{let e=document.createElement('div');e.className='contact';let a=document.createElement('div');a.className='avatar';av(a,u);let i=document.createElement('div');i.className='info';i.innerHTML='<b></b><small>Appuyer pour discuter</small>';i.firstChild.textContent=u.name;e.append(a,i);e.onclick=()=>open(u);b.append(e)})}catch(e){toast(e.message)}}$('#find').onclick=search;$('#q').onkeydown=e=>e.key==='Enter'&&search();$('#fab').onclick=()=>$('#q').focus();
async function open(u){current=u;$('#cn').textContent=u.name;av($('#cav'),u);$('#chat').classList.remove('hidden');if(S.bg)$('#msgs').style.backgroundImage=`url("${S.bg}")`;last='';await load(true);clearInterval(timer);timer=setInterval(()=>load(false),1800)}$('#back').onclick=()=>{clearInterval(timer);$('#chat').classList.add('hidden')};
async function load(force){if(!current)return;try{let d=await api('/api/messages?with='+encodeURIComponent(current.name));if(d.blocked){$('#cs').textContent='Bloquée';$('#msgs').innerHTML='<div class="empty">Conversation bloquée.</div>';return}let k=JSON.stringify(d.messages.map(m=>[m.id,m.text,m.mediaUrl,m.deletedFor]));if(!force&&k===last)return;last=k;let bottom=$('#msgs').scrollHeight-$('#msgs').scrollTop-$('#msgs').clientHeight<100;$('#msgs').innerHTML='';d.messages.forEach(m=>{let b=document.createElement('div');b.className='bubble '+(m.from===me.id?'mine':'theirs');if(m.type==='image'){let i=new Image();i.src=m.mediaUrl;b.append(i)}else if(m.type==='audio'){let a=document.createElement('audio');a.controls=true;a.preload='none';a.src=m.mediaUrl;b.append(a)}else{let t=document.createElement('div');t.textContent=m.text;b.append(t)}let tm=document.createElement('div');tm.className='time';tm.textContent=new Date(m.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});b.append(tm);b.oncontextmenu=e=>{e.preventDefault();del(m)};$('#msgs').append(b)});if(bottom||force)$('#msgs').scrollTop=$('#msgs').scrollHeight}catch{}}
async function del(m){let all=m.from===me.id&&confirm('OK = supprimer pour tout le monde\nAnnuler = supprimer pour moi');try{await api('/api/delete',{method:'POST',body:JSON.stringify({id:m.id,mode:all?'everyone':'me'})});last='';load(true)}catch(e){toast(e.message)}}
async function send(){let t=$('#text').value.trim();if(!t||!current)return;try{await api('/api/send',{method:'POST',body:JSON.stringify({to:current.name,text:t})});$('#text').value='';last='';load(true)}catch(e){toast(e.message)}}$('#send').onclick=send;$('#text').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();send()}};
$('#photo').onclick=()=>$('#img').click();$('#img').onchange=e=>{let f=e.target.files[0],r=new FileReader();if(!f)return;r.onload=async()=>{try{await api('/api/send',{method:'POST',body:JSON.stringify({to:current.name,text:'',media:{data:r.result,mime:f.type}})});last='';load(true)}catch(x){toast(x.message)}};r.readAsDataURL(f)};
$('#mic').onclick=async()=>{if(rec){rec.stop();$('#mic').classList.remove('recording');return}try{let s=await navigator.mediaDevices.getUserMedia({audio:true});let mt=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'].find(x=>MediaRecorder.isTypeSupported(x));rec=new MediaRecorder(s,mt?{mimeType:mt}:undefined);chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());let b=new Blob(chunks,{type:rec.mimeType||'audio/webm'}),r=new FileReader();r.onload=async()=>{try{await api('/api/send',{method:'POST',body:JSON.stringify({to:current.name,text:'',media:{data:r.result,mime:b.type}})});last='';load(true)}catch(e){toast(e.message)}};r.readAsDataURL(b)};rec.start();$('#mic').classList.add('recording');toast('Enregistrement… appuie encore pour arrêter')}catch{toast('Microphone non disponible')}};
$('#settings').onclick=()=>$('#set').classList.remove('hidden');$('#close').onclick=()=>$('#set').classList.add('hidden');$('#dark').onclick=()=>{S.dark=!S.dark;localStorage.nova_dark=S.dark?'1':'0';theme()};$('#color').oninput=e=>{S.color=e.target.value;localStorage.nova_color=S.color;theme()};$('#bg').onchange=e=>{let r=new FileReader();r.onload=()=>{S.bg=r.result;localStorage.nova_bg=S.bg;if(current)$('#msgs').style.backgroundImage=`url("${S.bg}")`};r.readAsDataURL(e.target.files[0])};$('#pf').onchange=e=>{let r=new FileReader();r.onload=async()=>{try{me.profilePhoto=(await api('/api/profile/photo',{method:'POST',body:JSON.stringify({data:r.result})})).profilePhoto;av($('#myav'),me)}catch(x){toast(x.message)}};r.readAsDataURL(e.target.files[0])};$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};$('#block').onclick=async()=>{if(confirm('Bloquer '+current.name+' ?')){await api('/api/block',{method:'POST',body:JSON.stringify({name:current.name,block:true})});toast('Contact bloqué');$('#cs').textContent='Bloquée'}};
async function loadN(){try{let d=await api('/api/notifications'),n=d.notifications.filter(x=>!x.read).length;$('#nb').textContent=n;$('#nb').classList.toggle('hidden',!n)}catch{}}$('#notifs').onclick=async()=>{let d=await api('/api/notifications');alert(d.notifications.length?d.notifications.map(x=>'Nouveau message de '+x.fromName).join('\n'):'Aucune notification');api('/api/notifications/read',{method:'POST'});loadN()};setInterval(()=>me&&loadN(),4000);boot();
</script></body></html>
